<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR.UI — Geometric World</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="world-page">

        <header class="world-header">

            <a href="index.html" class="back-btn">
                ← Back
            </a>

            <div class="world-title">

                <span>WORLD 01</span>

                <h1>
                    Geometric Shapes
                </h1>

            </div>

        </header>


        <section class="world-stage">

            <video
                id="camera"
                autoplay
                playsinline
                muted>
            </video>

            <canvas id="ar-canvas"></canvas>


            <div class="camera-message" id="camera-message">

                <h2>
                    Camera Access Required
                </h2>

                <p>
                    Allow camera access to enter the Geometric World.
                </p>

                <button id="start-camera">
                    Start Camera
                </button>

            </div>

        </section>


        <div class="world-controls">

            <span>
                HAND TRACKING
            </span>

            <span id="tracking-status">
                WAITING
            </span>

        </div>

    </main>


    <script src="geometric.js"></script>

</body>

</html>
